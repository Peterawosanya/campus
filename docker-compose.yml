services:
  db:
    image: postgres:16-alpine
    container_name: campusos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusos_local}
      POSTGRES_DB: ${POSTGRES_DB:-campusos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - campusos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusos} -d ${POSTGRES_DB:-campusos}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  campusos_pgdata:
